<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный тест по английскому</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            margin: 0;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
                border-radius: 24px;
            }
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
        }
        h2 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        h2 span {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            text-shadow: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .task-desc {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 14px 20px;
            border-radius: 16px;
            color: #cbd5e1;
            font-size: 15px;
            border-left: 4px solid #facc15;
            margin-bottom: 28px;
            line-height: 1.5;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .task-desc strong {
            color: #facc15;
        }

        .sentence-block {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 18px 22px 20px 22px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .sentence-block:hover {
            border-color: rgba(250, 204, 21, 0.25);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .russian {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.2);
        }
        .russian .num {
            color: #facc15;
            margin-right: 8px;
            font-weight: 800;
        }

        .answer-zone {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 6px;
            min-height: 56px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.12);
            margin: 8px 0 10px 0;
            transition: 0.2s;
        }
        .answer-zone:empty::before {
            content: '👆 Нажми на слова ниже, чтобы собрать предложение';
            color: #64748b;
            font-size: 15px;
            font-weight: 400;
            opacity: 0.6;
        }
        .answer-zone span {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #facc15;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            border: 1px solid rgba(250, 204, 21, 0.3);
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            letter-spacing: 0.3px;
        }
        .answer-zone span:hover {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0f172a;
            transform: scale(1.05);
            border-color: #facc15;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.35);
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            min-height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .word-btn {
            background: linear-gradient(135deg, #1e293b, #2d3a4f);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px 18px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            letter-spacing: 0.2px;
        }
        .word-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            transform: scale(1.05) translateY(-2px);
            border-color: #3b82f6;
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }
        .word-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: scale(0.92);
            filter: grayscale(0.6);
        }

        .status-line {
            margin-top: 10px;
            font-weight: 600;
            font-size: 15px;
        }
        .result-badge {
            display: inline-block;
            padding: 4px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.2px;
        }
        .result-correct {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
        .result-wrong {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
        }
        .btn-warning:hover {
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
        }
        .btn-success:hover {
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
        }
        .stat {
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.15);
            backdrop-filter: blur(10px);
            letter-spacing: 0.5px;
        }
        .stat span {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .russian { font-size: 17px; }
            .word-btn { font-size: 15px; padding: 6px 14px; }
            .answer-zone span { font-size: 16px; padding: 4px 12px; }
            h2 { font-size: 22px; }
            .btn { padding: 8px 18px; font-size: 13px; }
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sentence-block {
            animation: fadeSlideUp 0.4s ease forwards;
        }
        .sentence-block:nth-child(2) { animation-delay: 0.05s; }
        .sentence-block:nth-child(3) { animation-delay: 0.10s; }
        .sentence-block:nth-child(4) { animation-delay: 0.15s; }
        .sentence-block:nth-child(5) { animation-delay: 0.20s; }
        .sentence-block:nth-child(6) { animation-delay: 0.25s; }
        .sentence-block:nth-child(7) { animation-delay: 0.30s; }
        .sentence-block:nth-child(8) { animation-delay: 0.35s; }
        .sentence-block:nth-child(9) { animation-delay: 0.40s; }
        .sentence-block:nth-child(10) { animation-delay: 0.45s; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>
            🧩 Собери предложение
            <span>Possessive Case</span>
        </h2>
    </div>
    <div class="task-desc">
        <strong>📌 Как играть:</strong> Нажимай на слова в правильном порядке, чтобы получился перевод русского предложения.  
        Если ошибся — нажми на слово в <strong>жёлтой</strong> строке, чтобы убрать его.
    </div>

    <div id="builderContainer"></div>

    <div class="flex-row">
        <div class="btn-group">
            <button class="btn btn-warning" onclick="resetBuilder()">🔄 Сбросить всё</button>
            <button class="btn btn-success" onclick="checkBuilder()">✅ Проверить</button>
        </div>
        <div id="builderScore" class="stat">⭐ <span id="scoreDisplay">0</span> / 10</div>
    </div>
</div>

<script>
    const SENTENCES = [
        { ru: "Машина моей мамы красная.", en: "My mother's car is red." },
        { ru: "Это дом моих родителей.", en: "This is my parents' house." },
        { ru: "Телефон его брата сломан.", en: "His brother's phone is broken." },
        { ru: "Комната её сестры чистая.", en: "Her sister's room is clean." },
        { ru: "Книга нашей учительницы интересная.", en: "Our teacher's book is interesting." },
        { ru: "Хвост собаки короткий.", en: "The dog's tail is short." },
        { ru: "Имя моего друга — Алекс.", en: "My friend's name is Alex." },
        { ru: "Игрушки детей на столе.", en: "The children's toys are on the table." },
        { ru: "Сестра Тома — врач.", en: "Tom's sister is a doctor." },
        { ru: "Квартира моих бабушки и дедушки большая.", en: "My grandparents' apartment is big." }
    ];

    let builderState = [];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initBuilder() {
        builderState = SENTENCES.map((s) => {
            const words = s.en.match(/[\w']+|[.,!?;:]/g) || [];
            const shuffled = shuffleArray([...words]);
            return {
                correct: false,
                userOrderIndices: [],
                words: shuffled,
                original: words,
                ru: s.ru,
                en: s.en
            };
        });
        renderBuilder();
        updateScoreDisplay();
    }

    // --------------------------------------------------------------
    // ОТРИСОВКА С СОХРАНЕНИЕМ ССЫЛОК НА DOM-ЭЛЕМЕНТЫ
    // --------------------------------------------------------------
    function renderBuilder() {
        const container = document.getElementById('builderContainer');
        container.innerHTML = '';
        builderState.forEach((item, idx) => {
            const block = document.createElement('div');
            block.className = 'sentence-block';
            block.dataset.index = idx;

            // Русский текст
            const ruDiv = document.createElement('div');
            ruDiv.className = 'russian';
            ruDiv.innerHTML = `<span class="num">${idx+1}.</span> ${item.ru}`;
            block.appendChild(ruDiv);

            // Зона ответа
            const answerZone = document.createElement('div');
            answerZone.className = 'answer-zone';
            answerZone.id = `answerZone_${idx}`;
            block.appendChild(answerZone);

            // Банк слов
            const wordBank = document.createElement('div');
            wordBank.className = 'word-bank';
            wordBank.id = `wordBank_${idx}`;
            block.appendChild(wordBank);

            // Статус
            const statusDiv = document.createElement('div');
            statusDiv.className = 'status-line';
            statusDiv.id = `status_${idx}`;
            block.appendChild(statusDiv);

            container.appendChild(block);

            // Заполняем данными
            updateBlock(idx);
        });
        updateScoreDisplay();
    }

    // --------------------------------------------------------------
    // ОБНОВЛЕНИЕ ОДНОГО БЛОКА (БЕЗ ПЕРЕРИСОВКИ ВСЕГО DOM)
    // --------------------------------------------------------------
    function updateBlock(idx) {
        const item = builderState[idx];

        // Обновляем answer-zone
        const answerZone = document.getElementById(`answerZone_${idx}`);
        if (answerZone) {
            answerZone.innerHTML = '';
            const userOrder = item.userOrderIndices.map(i => item.words[i]);
            userOrder.forEach((word, wIdx) => {
                const span = document.createElement('span');
                span.textContent = word;
                span.title = 'Нажми, чтобы убрать';
                span.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeWordFromBuilder(idx, wIdx);
                });
                answerZone.appendChild(span);
            });
        }

        // Обновляем word-bank
        const wordBank = document.getElementById(`wordBank_${idx}`);
        if (wordBank) {
            wordBank.innerHTML = '';
            item.words.forEach((word, wIdx) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                if (item.userOrderIndices.includes(wIdx)) {
                    btn.disabled = true;
                }
                btn.textContent = word;
                btn.addEventListener('click', () => {
                    addWordToBuilder(idx, wIdx);
                });
                wordBank.appendChild(btn);
            });
        }
    }

    // --------------------------------------------------------------
    // ЛОГИКА
    // --------------------------------------------------------------
    function addWordToBuilder(idx, wordIndex) {
        const item = builderState[idx];
        if (!item.userOrderIndices) item.userOrderIndices = [];
        if (item.userOrderIndices.includes(wordIndex)) return;
        item.userOrderIndices.push(wordIndex);

        // Очищаем статус, если был проверен
        const statusDiv = document.getElementById(`status_${idx}`);
        if (statusDiv) statusDiv.innerHTML = '';

        updateBlock(idx);
        updateScoreDisplay();
    }

    function removeWordFromBuilder(idx, position) {
        const item = builderState[idx];
        if (!item.userOrderIndices) return;
        if (position >= 0 && position < item.userOrderIndices.length) {
            item.userOrderIndices.splice(position, 1);

            // Очищаем статус, если был проверен
            const statusDiv = document.getElementById(`status_${idx}`);
            if (statusDiv) statusDiv.innerHTML = '';

            updateBlock(idx);
            updateScoreDisplay();
        }
    }

    // --------------------------------------------------------------
    // ПРОВЕРКА
    // --------------------------------------------------------------
    function checkBuilder() {
        let correctCount = 0;
        builderState.forEach((item, idx) => {
            const original = item.original || [];
            const user = item.userOrderIndices.map(i => item.words[i]) || [];
            const isCorrect = JSON.stringify(user) === JSON.stringify(original);
            item.correct = isCorrect;
            if (isCorrect) correctCount++;

            const statusDiv = document.getElementById(`status_${idx}`);
            if (statusDiv) {
                if (isCorrect) {
                    statusDiv.innerHTML = `<span class="result-badge result-correct">✅ Верно!</span>`;
                } else {
                    statusDiv.innerHTML = `<span class="result-badge result-wrong">❌ Неверно. Правильно: «${item.en}»</span>`;
                }
            }
        });
        document.getElementById('scoreDisplay').textContent = correctCount;
    }

    // --------------------------------------------------------------
    // СБРОС
    // --------------------------------------------------------------
    function resetBuilder() {
        initBuilder();
        document.getElementById('scoreDisplay').textContent = '0';
    }

    function updateScoreDisplay() {
        // не обновляем счёт автоматически — только при проверке
    }

    // --------------------------------------------------------------
    // ЗАПУСК
    // --------------------------------------------------------------
    initBuilder();

    window.checkBuilder = checkBuilder;
    window.resetBuilder = resetBuilder;
</script>

</body>
</html>
